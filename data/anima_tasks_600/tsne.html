<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Anima 600 任务分布</title><style>body{font:16px system-ui;margin:24px;background:#f6f8fb;color:#172b42}canvas{background:white;border:1px solid #ccd5df;width:100%;max-width:1100px}select,input{padding:8px;margin-right:10px}pre{white-space:pre-wrap;background:white;padding:18px;min-height:90px;max-width:1064px}p{max-width:1100px}</style><h1>Anima 600 任务：文本 embedding 与 t-SNE</h1><p>悬停查看任务。圆点是训练任务，三角是独立提示词测试任务。二维距离仅供观察，去重依据原始 384 维向量；动作家族不保证跨集合隔离。</p><select id="cat"><option value="">全部类别</option></select><select id="split"><option value="">全部集合</option><option>train</option><option>eval</option></select><input id="query" placeholder="搜索任务文字或 ID"><p id="count"></p><canvas id="plot" width="1100" height="650"></canvas><pre id="tip">悬停或点击一个点查看任务。</pre><script id="data" type="application/json">[{"id": "cheese_rl_0001", "x": -8.739988, "y": 2.9784214, "category": "one_hand", "split": "train", "text": "盘坐伸手展示掌心，递物姿态\nA blue tiger sits cross-legged on a floor cushion, one arm extended forward with the palm open and fingers gently spread, as if offering a small object to the viewer."}, {"id": "cheese_rl_0002", "x": 0.49393722, "y": 33.069065, "category": "reclining", "split": "train", "text": "侧躺打电话脚掌贴地\nLie on side on a yoga mat, head on a small pillow, one hand pressing a phone to his ear, the opposite sole propped against the mat edge showing pads"}, {"id": "cheese_rl_0003", "x": -8.820551, "y": 34.923397, "category": "both_hands", "split": "train", "text": "站立双手前推掌心向前\nStanding with back to a wall, arms raised above head with palms flat against the wall (but palms not visible to camera). Instead, for this task, stand facing the wall with arms raised and palms flat on wall, but then camera is behind. Not good. Instead, stand with back to wall, arms raised forward with palms facing forward, as if pushing an invisible wall in front."}, {"id": "cheese_rl_0004", "x": 23.817354, "y": -11.616091, "category": "interaction", "split": "train", "text": "在厨房台面用平掌压扁面团\nHalf-turned at a kitchen counter, the tiger flattens one open hand to press a dough ball into a disc, leaning weight onto it, flour dusting the wood."}, {"id": "cheese_rl_0005", "x": -19.014086, "y": 1.6716522, "category": "hand_detail", "split": "train", "text": "拨动竖琴琴弦，双手手指清晰展示掌垫。\nPlucking a single string on a wooden harp, the blue tiger's fingers are poised mid-pluck, index finger pulled back and thumb anchoring the frame. His other hand dampens a lower string, pads pressing the wood."}, {"id": "cheese_rl_0006", "x": 14.877518, "y": 4.9074907, "category": "one_sole", "split": "train", "text": "侧手翻中途定格，高举的脚掌正对镜头。\nThe tiger does a slow cartwheel in a park and freezes mid-turn, one leg lifted high with its sole facing the camera."}, {"id": "cheese_rl_0007", "x": -10.080055, "y": 9.612278, "category": "hand_and_foot", "split": "train", "text": "坐床边叠衣服，手掌平抚布料，脚掌朝上露肉垫\nFolding laundry while seated on a bed, the blue tiger smooths a shirt with one open palm flat on the fabric, and one bare foot rests sole-up on the mattress edge facing the viewer."}, {"id": "cheese_rl_0008", "x": -1.5878496, "y": -21.64495, "category": "moving", "split": "train", "text": "半跪种苗，双手轻托幼苗，手指清晰。\nThe blue tiger kneels to plant seedlings, both hands cupped around a small plant in the soil, fingers gentle around the stem. One knee on the ground, the other foot flat in a half-kneel."}, {"id": "cheese_rl_0009", "x": 17.300251, "y": -9.365404, "category": "identity_control", "split": "train", "text": "蓝虎用力刷洗大锅上的污渍。\nThe blue tiger scrubs a stubborn stain from a large pot, both hands gripping a brush, shoulders hunched, water splashing onto the floor around the base of the pot."}, {"id": "cheese_rl_0010", "x": -18.719446, "y": 4.66244, "category": "sitting", "split": "train", "text": "坐在舞台边缘调小提琴，一手拧弦轴一手托琴。\nSeated on a stage-edge, the blue tiger dangles legs into the orchestra pit, tuning a violin with one hand twisting a peg and the other palm open under the instrument."}, {"id": "cheese_rl_0011", "x": 17.384169, "y": 4.365582, "category": "foot_detail", "split": "train", "text": "浅水中侧抬脚掌展示\nStanding in shallow surf, the tiger tilts a foot sideways so the sole faces the lens above the waterline. Toes splay as foam washes past, and the yellow pads gleam wet against a hazy ocean horizon."}, {"id": "cheese_rl_0012", "x": -4.125064, "y": 3.6908758, "category": "both_soles", "split": "train", "text": "脚掌打拍击鼓展示手掌足底\nLying propped on cushions, the blue tiger raises both legs and claps his soles together in a rhythm, holding a small drum in both hands."}, {"id": "cheese_rl_0013", "x": -6.6203713, "y": 24.912235, "category": "reclining", "split": "train", "text": "躺椅上手提壶浇花\nRecline on a rooftop lounger with a small watering can, tipping it to water a potted plant with one hand, the other steadying the pot with fingers visible"}, {"id": "cheese_rl_0014", "x": 16.948387, "y": -16.87323, "category": "interaction", "split": "train", "text": "坐凳上用勺子舀水，另一手摊开接水滴\nSitting on a low stool, the blue tiger ladles water from a bucket with one hand and cups the other open palm under the ladle to catch drips, leaning forward over the pail."}, {"id": "cheese_rl_0015", "x": -6.656063, "y": 31.807976, "category": "both_hands", "split": "train", "text": "荡秋千双手前伸掌心向上\nSitting on a swing (but hands free), legs dangling, arms raised forward with palms up, fingers spread. Body swinging slightly. Background: playground."}, {"id": "cheese_rl_0016", "x": 17.480835, "y": 0.14969108, "category": "one_hand", "split": "train", "text": "屋顶黄昏，单手摊开迎接无人机投下包裹\nOn a rooftop at dusk, the blue tiger holds one palm open toward a hovering drone that lowers a small parcel onto it, fingers steady and spread; city lights glitter below the outstretched arm."}, {"id": "cheese_rl_0017", "x": -4.8107505, "y": -7.980345, "category": "hand_and_foot", "split": "train", "text": "制陶轮旁双手塑泥，一脚踩踏板脚底朝低镜头\nSitting at a pottery wheel, the blue tiger shapes clay with both hands cupped around the spinning mound, and one bare foot presses the pedal with the sole turned up toward a low camera."}, {"id": "cheese_rl_0018", "x": -7.173513, "y": 0.8169824, "category": "identity_control", "split": "train", "text": "蓝虎在工作台修烤面包机，双手清晰。\nThe blue tiger crouches at a low workbench repairing a toaster, one paw inside the casing with a screwdriver and the other holding a small tray of screws."}, {"id": "cheese_rl_0019", "x": 25.114323, "y": -0.5133216, "category": "moving", "split": "train", "text": "单膝跪在篝火旁，右掌举向火焰试探热度。\nThe blue tiger kneels on one knee beside a campfire, right palm held up near the flames to test the heat, left hand resting flat on the thigh. Face lit from below."}, {"id": "cheese_rl_0020", "x": -23.371851, "y": 5.8402185, "category": "hand_detail", "split": "train", "text": "指尖转篮球，另一手摊开平衡，展示手指与掌垫。\nBalancing a spinning basketball on one extended index fingertip, the blue tiger tilts his head back and steadies his other hand out for balance. Fingers on the balancing hand are spread flat beneath the ball."}, {"id": "cheese_rl_0021", "x": 23.715618, "y": 10.624417, "category": "sitting", "split": "train", "text": "坐矮墙上擦小号，一手按阀一手擦。\nThe tiger sits on a low wall polishing a brass trumpet, one hand wrapped around its valves and the other wiping the bell with a cloth."}, {"id": "cheese_rl_0022", "x": 16.56571, "y": 20.737043, "category": "one_sole", "split": "train", "text": "下车时脚踩门槛，脚掌透过车门朝向镜头。\nThe tiger steps out of a car and lifts one foot onto the door sill, sole facing the camera through the open door."}, {"id": "cheese_rl_0023", "x": -3.352246, "y": 15.943887, "category": "both_soles", "split": "train", "text": "豆袋椅上看书并抬起双脚\nReclining on a beanbag chair, the blue tiger balances a book on raised knees while both bare feet press flat against the air toward the lens, soles visible with toes curled slightly."}, {"id": "cheese_rl_0024", "x": 1.18269, "y": 2.9862373, "category": "foot_detail", "split": "train", "text": "踮脚够高处，抬起的脚跟露出黄色肉垫与四趾。\nStanding on tiptoe to reach a high shelf, the blue tiger's near heel lifts, showing the yellow sole pad and four toes pressing on a wooden floor; pantry jars and shelves frame the close view."}, {"id": "cheese_rl_0025", "x": -2.641974, "y": 30.98299, "category": "reclining", "split": "train", "text": "躺垫子上折纸飞机露脚掌\nLie on his back on a picnic blanket folding a paper airplane, fingers creasing the wings precisely, one knee raised and the raised foot sole turned outward"}, {"id": "cheese_rl_0026", "x": -17.869696, "y": 6.733075, "category": "interaction", "split": "train", "text": "坐在钢琴前弹奏，另一手掌摊在琴木上\nSeated at a piano, the blue tiger presses keys with one hand while the other rests open and flat on the wood beside the keys, head tilted as it listens to the note."}, {"id": "cheese_rl_0027", "x": -13.890949, "y": -13.628849, "category": "hand_detail", "split": "train", "text": "双手拔瓶塞，展示用力抓握的手指与掌垫。\nPulling a stubborn cork from a bottle, the blue tiger twists with both hands, elbows out, fingers wrapped around the cork and bottle neck. His face grimaces with effort, yellow pads flashing between fingers."}, {"id": "cheese_rl_0028", "x": 9.172507, "y": 4.4658413, "category": "hand_and_foot", "split": "train", "text": "踢球瞬间，双臂张开摊掌，支撑脚后跟抬起露脚底\nKicking a soccer ball, the blue tiger is caught mid-swing with one foot contacting the ball and the planted foot's sole showing to a rear camera, both arms flung out with open palms for balance."}, {"id": "cheese_rl_0029", "x": 9.166987, "y": 23.76836, "category": "sitting", "split": "train", "text": "坐垫上修车胎，双手打气，脚踩内胎。\nThe tiger sits on a woven mat repairing a bicycle tire, holding a small pump with both hands while one bare foot pins the inner tube to the floor."}, {"id": "cheese_rl_0030", "x": -21.543762, "y": -0.44856542, "category": "one_hand", "split": "train", "text": "公交站抬手看表，掌心向上\nStanding at a bus stop, the blue tiger checks a wristwatch by turning one hand palm-up, fingers gently fanned to read the time."}, {"id": "cheese_rl_0031", "x": -1.1134812, "y": -27.826, "category": "one_sole", "split": "train", "text": "躺在野餐毯上，向镜头张开脚掌和四趾。\nReclining on a picnic blanket, the tiger raises one foot toward a friend and flexes the sole wide open, toes spread."}, {"id": "cheese_rl_0032", "x": -20.002516, "y": -9.914515, "category": "identity_control", "split": "train", "text": "蓝虎在阁楼用望远镜观测窗外。\nThe blue tiger peers into a telescope aimed out a round attic window, one hand adjusting the focus knob, the other bracing the tube, one eye squinting into the eyepiece."}, {"id": "cheese_rl_0033", "x": -8.168356, "y": 32.12307, "category": "both_hands", "split": "train", "text": "坐着向前展示双手手掌\nSeated cross-legged on a low wooden stool, lean forward slightly and extend both arms straight toward the viewer, palms open and facing forward as if presenting an invisible object. Fingers naturally spread. Background: blurred workshop shelves."}, {"id": "cheese_rl_0034", "x": 10.038074, "y": -16.125792, "category": "moving", "split": "train", "text": "蹲着捏水管喷水浇园\nThe blue tiger crouches in a garden and aims a garden hose with one hand, the other hand pinching the nozzle tip to spray, water arcing out."}, {"id": "cheese_rl_0035", "x": 0.9004362, "y": 15.180515, "category": "both_soles", "split": "train", "text": "仰卧空中蹬车展示双足底\nLying on his back on a rug, the blue tiger pedals an imaginary bicycle in the air, both soles rotating toward the viewer, one hand behind his head and the other pointing at the ceiling."}, {"id": "cheese_rl_0036", "x": 4.7859864, "y": 11.021309, "category": "foot_detail", "split": "train", "text": "瑜伽垫上抬腿张开脚趾的足底特写\nLying on a yoga mat, the blue tiger raises one leg straight up and spreads the toes wide, showing the yellow palm-like sole pad clearly."}, {"id": "cheese_rl_0037", "x": -1.3303291, "y": 34.221153, "category": "reclining", "split": "train", "text": "躺沙滩巾上涂防晒露手掌\nLie on back on a beach towel, applying sunscreen to one forearm with an open palm, the other arm stretched out"}, {"id": "cheese_rl_0038", "x": 19.877546, "y": -0.5928388, "category": "interaction", "split": "train", "text": "钻在床单里手掌按布演影子戏\nCrouching under a hanging sheet, the tiger holds a flashlight in one hand and presses the other open palm against the fabric, casting a shadow puppet."}, {"id": "cheese_rl_0039", "x": 6.4115257, "y": -23.635042, "category": "identity_control", "split": "train", "text": "蓝虎在码头上拖着沉重麻袋走向小船。\nThe blue tiger drags a heavy sack across a wooden dock toward a waiting boat, leaning back into the pull, both hands gripping the sack's tied neck, rope trailing behind."}, {"id": "cheese_rl_0040", "x": 16.529163, "y": -6.875737, "category": "sitting", "split": "train", "text": "坐防布上刷地板，单膝立起。\nSitting on a paint-stained tarp, the tiger dips a broad brush into a bucket and paints a floorboard, one knee up and the other leg folded beneath it."}, {"id": "cheese_rl_0041", "x": -5.701005, "y": 33.786224, "category": "both_hands", "split": "train", "text": "仰卧双手向上伸掌\nLying on back with knees bent and feet flat, arms extended upward toward the ceiling, palms facing forward, fingers spread. Head resting on floor, looking up at hands."}, {"id": "cheese_rl_0042", "x": -14.525412, "y": -6.613219, "category": "hand_detail", "split": "train", "text": "双手举圆镜检查天花板，展示握边手指\nThe blue tiger stands and holds a round mirror with both hands to inspect a spot on the ceiling, fingers gripping the rim, the yellow palm pads visible on the mirror's edge."}, {"id": "cheese_rl_0043", "x": -2.313003, "y": 3.5274239, "category": "both_soles", "split": "train", "text": "影院翘脚吃爆米花展示手掌足底\nSitting in a theatre seat, the blue tiger props both feet on the row ahead, soles facing back toward the camera, munching popcorn from a bucket in his lap."}, {"id": "cheese_rl_0044", "x": -9.176631, "y": -2.1804557, "category": "one_hand", "split": "train", "text": "市集伸手接零钱，掌心朝上\nAt a market stall, the blue tiger holds out one open palm to receive change, fingers gently spread toward the vendor."}, {"id": "cheese_rl_0045", "x": -17.623737, "y": 15.134702, "category": "moving", "split": "train", "text": "蓝色老虎推购物车在超市过道走，双手握把手，一脚迈步。\nThe blue tiger pushes a shopping cart through a grocery aisle, both hands wrapped around the handlebar with palms facing down, one foot stepping forward mid-stride in a natural walk."}, {"id": "cheese_rl_0046", "x": 4.6104684, "y": -1.1024964, "category": "hand_and_foot", "split": "train", "text": "靠墙倒立，双掌撑地，一只脚掌贴墙朝向镜头\nThe adult blue tiger does a handstand against a brick wall, both palms flat on the ground while one bare foot rests against the wall showing its sole."}, {"id": "cheese_rl_0047", "x": 16.410353, "y": -19.82081, "category": "one_sole", "split": "train", "text": "浴缸边抬脚查看脚底\nSitting in a bathtub's edge, the blue tiger lifts one wet foot onto the rim and examines the sole, toes dripping, while clutching a towel with the other hand."}, {"id": "cheese_rl_0048", "x": 11.678065, "y": -9.29958, "category": "foot_detail", "split": "train", "text": "从石头上跳下，后脚向后踢起露出脚底四趾。\nClose-up of the blue tiger stepping off a low boulder, one foot planted and the trailing foot kicked back so its sole faces the lens; four toes and yellow pads crisp, dust puffing from the landing."}, {"id": "cheese_rl_0049", "x": -5.7706494, "y": 22.496582, "category": "reclining", "split": "train", "text": "吊床里垂脚露出脚掌\nRecline in a hammock with feet hanging out one end, one foot sole facing forward toward the camera, hands clasped behind head"}, {"id": "cheese_rl_0050", "x": 17.724905, "y": 13.248394, "category": "interaction", "split": "train", "text": "跨坐横梁伸手抓晃动的绳穗\nThe tiger straddles a low beam and reaches one open hand out to catch a dangling rope tassel, fingers spread wide, eyes focused on the swinging end."}, {"id": "cheese_rl_0051", "x": -6.8402843, "y": -10.671883, "category": "both_hands", "split": "train", "text": "双手抛接三颗发光球\nThe blue tiger juggles three glowing orbs, both palms facing upward mid-toss with fingers wide and alert, eyes tracking the highest orb."}, {"id": "cheese_rl_0052", "x": 24.122389, "y": 14.820963, "category": "sitting", "split": "train", "text": "坐木箱系长靴鞋带，赤脚踩箱沿。\nSitting on a low crate, the tiger laces a tall boot by pulling the lace with one hand while the other holds the boot's tongue, one bare sole planted on the crate edge."}, {"id": "cheese_rl_0053", "x": -7.334493, "y": 20.019524, "category": "identity_control", "split": "train", "text": "老虎躺在吊床上看书，双手握书清晰可见。\nThe blue tiger reclines on a hammock strung between two trees, one leg draped over the edge, reading a small book held above its face."}, {"id": "cheese_rl_0054", "x": 23.358566, "y": -14.053562, "category": "hand_detail", "split": "train", "text": "站在台前切菜，一手按稳食材一手握刀，双手手指清晰。\nThe blue tiger stands at a counter and slices a vegetable, one hand holding the food steady with fingertips tucked, the other gripping a knife handle firmly."}, {"id": "cheese_rl_0055", "x": 4.262504, "y": -7.4107814, "category": "one_hand", "split": "train", "text": "蓝虎冬季举起单手掌心接雪花\nThe blue tiger holds up one hand palm-out at shoulder height, catching a falling snowflake, while its breath fogs the crisp winter air."}, {"id": "cheese_rl_0056", "x": 13.378942, "y": 3.5351741, "category": "one_sole", "split": "train", "text": "坐在滑板上，将一只脚掌平举向镜头。\nSitting on a skateboard at a skatepark, the tiger plants one foot on the deck and raises the other leg toward the lens, sole flat."}, {"id": "cheese_rl_0057", "x": -16.212917, "y": -19.306507, "category": "moving", "split": "train", "text": "探出火车窗手搭凉棚\nThe blue tiger leans out of a train window, one palm flat on the frame and the other shading its eyes, wind ruffling fur."}, {"id": "cheese_rl_0058", "x": -0.114397764, "y": -2.1060872, "category": "hand_and_foot", "split": "train", "text": "坐地毯拼模型飞机，手掌平压机翼，脚掌翻上露肉垫\nSitting on a rug assembling a model airplane, the blue tiger presses one open palm flat on the wing, and one foot turned up shows its yellow-padded sole near the scattered parts."}, {"id": "cheese_rl_0059", "x": 13.612956, "y": -22.9627, "category": "both_soles", "split": "train", "text": "躺椅涂防晒展示手掌与足底\nThe blue tiger reclines on a pool lounger, feet raised and soles toward the viewer, squirting sunscreen from a bottle held in one hand onto his other palm."}, {"id": "cheese_rl_0060", "x": 11.762138, "y": 6.217986, "category": "foot_detail", "split": "eval", "text": "翻滚后展示双脚掌\nRolling forward in a somersault, the tiger ends seated with both feet lifted and soles presented to the camera, toes curled. Dust settles around them and the yellow pads face forward against a plain mat."}, {"id": "cheese_rl_0061", "x": -3.9153435, "y": 28.549513, "category": "reclining", "split": "eval", "text": "倒挂沙发扶手看漫画大笑\nRecline on a sofa armrest draped backward, holding a comic book upside down and laughing, the other hand slapping the cushion with spread fingers"}, {"id": "cheese_rl_0062", "x": 13.628364, "y": 20.529568, "category": "interaction", "split": "eval", "text": "蹲下拉抽屉一手按柜面\nThe tiger crouches to open a low drawer, one open palm pulling the handle while the other palm presses the drawer face flat, face close to the gap."}, {"id": "cheese_rl_0063", "x": 18.844488, "y": -5.0770946, "category": "hand_detail", "split": "eval", "text": "举手绘壁画，展示握笔与托调色盘的手及掌垫。\nThe blue tiger paints a mural, holding a brush in one hand and a small palette in the other. His brush hand is raised high on tiptoe, fingers wrapped around the handle, palette thumb hooked through the hole with pads visible."}, {"id": "cheese_rl_0064", "x": -14.281207, "y": 8.050105, "category": "one_hand", "split": "eval", "text": "图书馆翻书页，掌心微朝镜头\nIn a library, the blue tiger turns a single page with one hand, palm angled toward the viewer and fingers delicately separated over the paper."}, {"id": "cheese_rl_0065", "x": -15.524217, "y": 11.252527, "category": "identity_control", "split": "eval", "text": "蓝虎低头抱着一摞书过矮门。\nThe blue tiger ducks under a low doorway carrying a stack of books, chin pressing the top book down, both hands wrapped around the wobbling tower."}, {"id": "cheese_rl_0066", "x": 5.6481233, "y": 23.044634, "category": "sitting", "split": "eval", "text": "坐长椅上穿线，双手持竹竿。\nSeated on a garden bench, the tiger balances a long bamboo pole across its lap and threads a string through a hole at its tip with both hands."}, {"id": "cheese_rl_0067", "x": -5.8191566, "y": 35.308643, "category": "both_hands", "split": "eval", "text": "蹲下双臂侧伸掌心向前\nCrouching with knees bent and back straight, arms extended sideways with palms facing forward, fingers splayed. Head turned to look at the camera. Background: forest."}, {"id": "cheese_rl_0068", "x": -22.949808, "y": -5.3347454, "category": "moving", "split": "eval", "text": "蓝色老虎坐咖啡馆桌边搅茶，一手握杯柄露出掌心，一手拿勺。\nThe blue tiger sits at a cafe table stirring tea, one hand curled around the cup handle with the palm visible, the other hand holding a spoon mid-stir, head turned slightly toward a window."}, {"id": "cheese_rl_0069", "x": 15.144117, "y": -0.53994584, "category": "hand_and_foot", "split": "eval", "text": "弯腰关落地灯，手掌伸向开关，脚掌侧翻露肉垫\nLeaning to switch off a floor lamp, the blue tiger extends one open hand toward the switch with fingers spread, and one foot rests sideways on its outer edge so the yellow sole faces out."}, {"id": "cheese_rl_0070", "x": 18.877037, "y": -16.01372, "category": "one_sole", "split": "eval", "text": "老虎坐柜台抬右脚冲水，脚底朝镜头可见。\nThe blue tiger sits on a kitchen counter and lifts its right foot toward the sink faucet, sole tilted up to the viewer, while turning the tap with one hand."}, {"id": "cheese_rl_0071", "x": 11.192967, "y": -12.180802, "category": "foot_detail", "split": "eval", "text": "雨后石板上迈步抬脚的足部特写\nThe blue tiger walks barefoot across cool paving stones after rain, pausing mid-step so the raised foot shows wet yellow pads and four toes."}, {"id": "cheese_rl_0072", "x": 4.798262, "y": 3.500829, "category": "both_soles", "split": "eval", "text": "长椅喂鸽子伸脚展示双足底\nSitting on a park bench, the blue tig gnifying glass, the blue tiger brings its other hand palm-up close to inspect a tiny insect crawling across its fingers."}, {"id": "cheese_rl_0080", "x": 9.69815, "y": -23.867392, "category": "hand_and_foot", "split": "train", "text": "皮划艇上划桨，双手握桨，单脚底踩船舷朝镜头\nSitting in a kayak, the blue tiger paddles with both hands gripping the shaft, and lifts one foot so the sole presses against the kayak rim facing the camera above the water."}, {"id": "cheese_rl_0081", "x": -8.544883, "y": 33.336975, "category": "both_hands", "split": "train", "text": "坐地双腿前伸双手掌心向上\nSitting on the floor with legs stretched forward, lean back on one hand (but palm not visible), while the other arm reaches forward with palm up. However, for this task, both hands must be free and palms visible: instead, sit with legs stretched and both arms raised forward, palms up."}, {"id": "cheese_rl_0082", "x": 20.439402, "y": 14.166982, "category": "one_sole", "split": "train", "text": "单膝跪地，向后抬脚将脚掌展示给镜头。\nKneeling on one knee beside a chalk drawing, the tiger extends the other leg backward and lifts that foot high, sole facing the camera."}, {"id": "cheese_rl_0083", "x": 6.0386457, "y": 0.7098751, "category": "both_soles", "split": "train", "text": "梯上读书晃腿展示双足底\nThe blue tiger sits atop a rolling library ladder, legs dangling and swinging while he reads a folded newspaper, both soles turned outward toward the camera mid-swing."}, {"id": "cheese_rl_0084", "x": 2.9394667, "y": 9.631939, "category": "foot_detail", "split": "train", "text": "跪坐在榻榻米上，一条腿外转，脚底朝镜头，四趾分开。\nThe blue tiger kneels on a tatami mat and rotates one leg outward, sole flat toward the camera, toes spread across the mat; a lantern casts warm shadows, four toes and yellow pads distinct."}, {"id": "cheese_rl_0085", "x": -3.0530097, "y": 25.960073, "category": "reclining", "split": "eval", "text": "半躺台阶上翘脚掌\nSit half-reclined on stone steps leaning back on elbows, legs stretched down the steps, one sole facing the camera showing pads"}, {"id": "c ht."}, {"id": "cheese_rl_0257", "x": 3.4210436, "y": 3.5161037, "category": "identity_control", "split": "train", "text": "老虎侧身跃过公园长椅，支撑手可见。\nThe blue tiger vaults over a park bench sideways, one hand planted on the backrest and legs swept horizontally."}, {"id": "cheese_rl_0258", "x": -9.028578, "y": 8.537685, "category": "sitting", "split": "train", "text": "坐在垫子上折纸鹤，双手在胸前压折痕。\nSeated on a cushion, the blue tiger folds a paper crane, both hands raised at chest height with fingertips pressing creases, elbows resting on a small table and one heel tucked under the opposite thigh."}, {"id": "cheese_rl_0259", "x": -11.123716, "y": 14.196994, "category": "hand_and_foot", "split": "train", "text": "躺在野餐垫上看书，手掌朝外，脚掌朝上展示\nThe blue tiger reclines on a picnic blanket reading a paperback, holding the book with one hand whose palm faces outward, while one bare foot points up so the sole and four toes are clearly shown."}, {"id": "cheese_rl_0260", "x": 23.160679, "y": -12.731352, "category": "moving", "split": "train", "text": "坐在厨房台面上用双手压饼干模具\nThe blue tiger sits on a kitchen counter edge, carefully pressing a cookie cutter into dough with both palms, leaning forward over the rolling pin."}, {"id": "cheese_rl_0261", "x": 4.5974774, "y": -5.9588223, "category": "one_sole", "split": "train", "text": "雪地蹲下抬脚比对脚印，脚底朝镜头\nThe blue tiger crouches to inspect a footprint in the snow, comparing it with his own lifted foot turned sole-up toward the camera, one hand on his knee, other pointing down."}, {"id": "cheese_rl_0262", "x": -2.5063787, "y": -21.079206, "category": "both_hands", "split": "train", "text": "蹲在花圃旁，双手捧着幼苗培土。\nCrouched beside a garden bed, the blue tiger holds both palms cupped around a small seedling, gently patting soil with its fingertips while looking down attentively."}, {"id": "cheese_rl_0263", "x": 0.7174451, "y": 7.1122465, "category": "both_soles", "split": "train", "text": "坐凳用脚转盘子展示双足\nSeated on a wooden stool, the blue tiger leans back and balances a spinning plate on one raised foot, the other foot flat with sole angled toward the lens, grinning."}, {"id": "cheese_rl_0264", "x": 11.299074, "y": 10.288873, "category": "foot_detail", "split": "train", "text": "吊床垂腿展示脚掌\nThe tiger sits in a hammock strung between palms, one leg dangling so the sole turns toward the camera and toes flex. The other leg tucks inside and the yellow pads show against a bright tropical background."}, {"id": "cheese_rl_0265", "x": -4.446645, "y": 30.63906, "category": "reclining", "split": "train", "text": "靠树吃零食露手掌\nSit reclined against a tree trunk with a bowl of snacks, picking one up with thumb and forefinger, the other palm resting open on his knee"}, {"id": "cheese_rl_0266", "x": 19.227634, "y": 11.720701, "category": "interaction", "split": "train", "text": "踮脚挂灯笼一手扶墙\nStanding on tiptoe, the tiger stretches one arm high to hang a round paper lantern on a hook, the other open hand splayed against the wall for balance, seen from a low side angle."}, {"id": "cheese_rl_0267", "x": 17.72616, "y": -16.778801, "category": "one_hand", "split": "train", "text": "俯身水槽接水，掌心向上\nLeaning over a sink, the blue tiger cups one hand under the faucet, palm up and fingers together, catching water with the yellow pads visible."}, {"id": "cheese_rl_0268", "x": 16.125505, "y": -10.07517, "category": "hand_detail", "split": "train", "text": "跪地双手掌压平黏土，展示掌垫\nThe blue tiger kneels on a workshop floor, pressing both palms flat onto a sheet of clay to flatten it, fingers splayed wide with the yellow palm pads pressing into the surface."}, {"id": "cheese_rl_0269", "x": 17.578737, "y": -5.455198, "category": "sitting", "split": "train", "text": "蓝虎坐梯台画架前作画\nThe blue tiger sits on a step ladder platform painting a small canvas on an easel, right hand holding a brush and left hand steadying the canvas edge."}, {"id": "cheese_rl_0270", "x": -9.12971, "y": 4.216662, "category": "identity_control", "split": "train", "text": "蓝虎在门廊摇椅上织围巾，双手清楚。\nThe blue tiger sits in a ro m."}, {"id": "cheese_rl_0446", "x": -1.6762615, "y": 36.26058, "category": "reclining", "split": "train", "text": "趴码头伸手拨水\nLie on stomach on a dock over water, one arm reaching down to trail fingers in the water, the other hand cushioning his chin"}, {"id": "cheese_rl_0447", "x": -8.398077, "y": -8.64347, "category": "one_hand", "split": "train", "text": "坐台阶举手接球，掌心朝上\nSitting on a porch step, the blue tiger raises one hand palm-out to catch a tossed ball, fingers spread wide and reaching upward."}, {"id": "cheese_rl_0448", "x": 22.704279, "y": -12.23406, "category": "hand_detail", "split": "train", "text": "双手揉面，展示掌根下压与掌垫沾粉。\nThe blue tiger kneads dough on a floured counter, pressing with the heels of both palms and curling his fingers back. Flour dusts his yellow pads as his knuckles rise. Three-quarter overhead view."}, {"id": "cheese_rl_0449", "x": 17.968735, "y": -5.328494, "category": "identity_control", "split": "train", "text": "老虎在户外画架前作画，双手与手指清晰。\nThe blue tiger stands at an easel outdoors, one hand steadying a palette and the other raising a brush toward the canvas."}, {"id": "cheese_rl_0450", "x": -22.634977, "y": -5.600641, "category": "sitting", "split": "train", "text": "蓝虎坐高脚凳捧杯吹热气\nThe blue tiger sits sideways on a tall bar stool, one leg crossed over the other at the ankle, holding a mug with both hands near the chest and blowing gently on the steam."}, {"id": "cheese_rl_0451", "x": -0.800929, "y": -21.1833, "category": "hand_and_foot", "split": "train", "text": "跪地种树，手掌压土，脚掌踩铁锹借力\nThe adult blue tiger kneels to plant a small tree, one palm pressing soil and one foot sole resting flat on the shovel blade for leverage."}, {"id": "cheese_rl_0452", "x": -4.411533, "y": 7.23676, "category": "one_sole", "split": "train", "text": "侧卧野餐垫，上侧脚底朝向观众翻书\nThe blue tiger lies on his side on a picnic blanket, propping himself on one elbow, the top leg bent forward so its sole faces the viewer while the lower leg rests flat, a book open before him."}, {"id": "che ng far forward."}, {"id": "cheese_rl_0487", "x": 1.0943316, "y": 11.509533, "category": "both_soles", "split": "train", "text": "躺在吊床上抬腿露脚底\nLying on a hammock, the blue tiger swings his legs up over the edge so both bare soles face the viewer, one paw holding the hammock rope and the other resting on his belly."}, {"id": "cheese_rl_0488", "x": -5.166681, "y": -17.175669, "category": "both_hands", "split": "train", "text": "站在树下双手合拢接住落下的苹果。\nStanding beneath a tree, the blue tiger holds both palms up together to receive a heavy falling apple, bracing its stance with feet apart."}, {"id": "cheese_rl_0489", "x": 14.10688, "y": 10.347808, "category": "one_sole", "split": "train", "text": "在窄梁上保持平衡，回身查看抬起的脚掌。\nBalanced on a narrow garden beam, the tiger lifts one hind foot behind and twists to look back at it, sole angled upward."}, {"id": "cheese_rl_0490", "x": 9.823776, "y": -22.150852, "category": "interaction", "split": "train", "text": "从船边俯身用平掌探水流\nLeaning out of a small boat, the blue tiger lowers one flat open hand toward the water surface to feel the current, the other hand trailing a paddle behind."}, {"id": "cheese_rl_0491", "x": -1.3076309, "y": 14.675083, "category": "reclining", "split": "train", "text": "靠着大枕头坐躺、手掌托弹珠\nThe blue tiger reclines against a large plush pillow, one leg stretched long and the other folded under, its near hand resting on the floor with palm up holding a small marble."}, {"id": "cheese_rl_0492", "x": 19.43268, "y": -4.9826436, "category": "one_hand", "split": "train", "text": "躺在颜料画布上单掌朝上，五指染满颜色\nThe blue tiger lies on a canvas of wet paint, one open palm lifted toward the ceiling as if halting the light, fingers spread and daubed with color; the studio floor around the sprawled legs is a swirl of pigments."}, {"id": "cheese_rl_0493", "x": -0.2526347, "y": -2.4713132, "category": "identity_control", "split": "train", "text": "蓝虎跪地拼模型，双手清楚可辨。\nThe blue tiger kneels on a rug to assemble a model airplane, leaning over scattered parts ole", "split": "train", "text": "吊床侧躺，一只脚掌侧向镜头清晰可见。\nLeaning back in a hammock, the tiger lifts both legs but turns one foot so its sole faces the side viewer while the other foot rests crossed."}, {"id": "cheese_rl_0501", "x": -13.722664, "y": 12.257828, "category": "interaction", "split": "train", "text": "躲在书堆后一只手压书顶\nThe tiger crouches behind a tall stack of books, peeking over the top while one open palm presses flat on the uppermost cover, the other hand gripping the shelf edge."}, {"id": "cheese_rl_0502", "x": 6.609836, "y": -25.418459, "category": "reclining", "split": "train", "text": "侧躺甲板上双手拉绳，脚掌抵住系缆桩\nLying on its side on a sailboat deck, the blue tiger hauls a rope in with both hands, heels braced against a cleat, one sole turned up toward the camera."}, {"id": "cheese_rl_0503", "x": -19.376339, "y": -9.475301, "category": "one_hand", "split": "train", "text": "观星时张开右掌测量星距。\nThe blue tiger crouches beside a telescope, extending its right arm toward the night sky with the palm open and fingers spread as if measuring stars between them. The left hand adjusts the mount. Camera low behind the shoulder, sky wide."}, {"id": "cheese_rl_0504", "x": -17.8822, "y": 6.6264377, "category": "identity_control", "split": "train", "text": "蓝虎坐在钢琴前弹奏，双手可见。\nThe blue tiger sits at a piano bench, both paws poised over the keys mid-chord, sheet music open and a metronome ticking on the lid."}, {"id": "cheese_rl_0505", "x": -10.2121935, "y": 8.262519, "category": "hand_detail", "split": "train", "text": "坐床上叠毛巾，双手对齐边缘并用掌侧压折痕，双手清晰。\nThe blue tiger sits on a bed and folds a towel, aligning edges with both hands, pressing the crease with the side of one palm and fingers flattened."}, {"id": "cheese_rl_0506", "x": -13.481899, "y": 6.014017, "category": "sitting", "split": "train", "text": "蓝虎坐桌前握笔写字\nThe blue tiger sits at a small desk writing in a notebook, left hand steadying the page and right hand holding a pen, shoulders hunched slightly in concentration."}, {"id": "cheese_rl_0507", "x": -1.0252223, "y": 1.1638715, "category": "hand_and_foot", "split": "train", "text": "坐垫上擦门把手，手掌托把手朝镜头，脚掌搭膝\nThe blue tiger sits on a cushion polishing a brass doorknob, one open palm cupping the knob toward the camera, and one foot raised with the yellow-padded sole pressed to the other knee."}, {"id": "cheese_rl_0508", "x": -6.1046724, "y": 13.491016, "category": "both_soles", "split": "train", "text": "侧躺沙发举脚露底拿遥控器\nLying sideways on a couch, the blue tiger bends his top knee and lifts the lower foot so both soles angle toward the camera, one arm draped over the backrest and one holding a TV remote."}, {"id": "cheese_rl_0509", "x": -3.4954004, "y": -15.061703, "category": "moving", "split": "train", "text": "双手悬挂在树枝上\nThe blue tiger hangs from a horizontal tree branch with both hands, legs dangling and knees bent, tail curled around the branch for support."}, {"id": "cheese_rl_0510", "x": -10.541336, "y": -5.7186174, "category": "both_hands", "split": "train", "text": "倒挂横杆，双臂下垂翻掌朝镜头\nHanging by its knees from a horizontal bar, the blue tiger lets both arms dangle and turns palms outward toward the viewer, head upside down, fur falling away from open fingers."}, {"id": "cheese_rl_0511", "x": 10.638378, "y": -10.895045, "category": "one_sole", "split": "train", "text": "泥地抬脚向镜头展示沾泥的脚底\nThe blue tiger steps in fresh mud, then lifts one foot toward the camera to show the sole coated in mud with yellow pads peeking through, other foot still sunk, one hand on hip."}, {"id": "cheese_rl_0512", "x": 7.2824655, "y": -20.0402, "category": "interaction", "split": "train", "text": "站在池塘边一手握竿一手遮阳眺望\nThe blue tiger stands at a fishing pond edge, holding a rod with one hand while the other open palm shields its eyes from the sun as it scans the water, feet planted apart."}, {"id": "cheese_rl_0513", "x": -5.6330123, "y": 11.388939, "category": "reclining", "split": "train", "text": "横躺扶手椅、一手垂地、一手放肚子\nLying across a wide armchair on its back, the blue tiger folds one leg over the armrest and rests the other foot flat on the seat; one hand dangles to the floor palm-down, the other rests on its stomach."}, {"id": "cheese_rl_0514", "x": 23.91793, "y": -2.787057, "category": "one_hand", "split": "train", "text": "玻璃作坊里单掌靠近熔融玻璃感受温度\nThe blue tiger crouches inside a glass-blowing workshop, one open palm cupped near a glowing molten blob on the end of a pipe, fingers spread to judge the heat; orange light rims the hand against the dark shed."}, {"id": "cheese_rl_0515", "x": -3.8788233, "y": -27.18317, "category": "identity_control", "split": "train", "text": "蓝虎仰卧看地图，双手握住地图。\nThe blue tiger lies on its back on a picnic blanket, holding a paper map above its face with both paws while a wicker basket and scattered apples rest beside it."}, {"id": "cheese_rl_0516", "x": 0.18695474, "y": 19.290756, "category": "hand_detail", "split": "train", "text": "趴着看地图，一手托腮一手描路线，展示掌垫。\nThe blue tiger lies on his stomach reading a large map, chin propped on one fist while the other hand traces a route with an extended index finger. His palm rests flat on the paper, pad exposed."}, {"id": "cheese_rl_0517", "x": -9.369476, "y": -25.960114, "category": "sitting", "split": "train", "text": "盘腿坐着挑水果，摊开手掌露出掌垫。\nThe tiger sits cross-legged on a low cushion, cradling a wide ceramic bowl in its lap and picking out a round fruit with one hand, palm cupped and fingers spread."}, {"id": "cheese_rl_0518", "x": 9.422988, "y": -2.1672482, "category": "hand_and_foot", "split": "train", "text": "走扁带保持平衡，脚掌踩线手掌下伸张开\nThe adult blue tiger balances on a slackline strung between trees, one sole flat on the line and one palm extended downward with fingers spread for stability."}, {"id": "cheese_rl_0519", "x": -7.5941296, "y": -13.634853, "category": "moving", "split": "train", "text": "蓝色老虎跪在地上伸手抚摸猫的头，另一手放在大腿上，微微弓背。\nThe blue tiger kneels to pet a housecat, one palm open and lowered toward the cat's head, the other hand flat on its own thigh, back gently curved, feet tucked behind in a plantigrade kneel."}, {"id": "cheese_rl_0520", "x": 1.0431591, "y": -5.5709977, "category": "both_hands", "split": "train", "text": "躲在纸箱中，双掌从星形孔伸出张开，展示手指。\nThe blue tiger crouches inside a cardboard box cut with star-shaped holes, pushing one palm out through each hole with fingers splayed like star points while peering through the flaps."}, {"id": "cheese_rl_0521", "x": 1.3681699, "y": 6.725219, "category": "both_soles", "split": "train", "text": "用双足夹杯展示脚掌\nPerched sideways on a tall bar stool, the blue tiger kicks both legs forward and holds a mug of cocoa between his soles, feet pressed together with pads facing the lens."}, {"id": "cheese_rl_0522", "x": 4.3396263, "y": -1.3677721, "category": "one_sole", "split": "train", "text": "靠墙抬脚抵砖，单脚脚底贴墙\nThe blue tiger leans against a brick wall and lifts one foot to rest its sole flat on the bricks beside him, arms crossed, the other foot planted, head tilted as he looks down."}, {"id": "cheese_rl_0523", "x": -14.912816, "y": -3.3723917, "category": "interaction", "split": "train", "text": "伸手用平掌测量门框宽度\nThe blue tiger stretches one arm across a doorway to press a flat open palm against the frame, measuring its width, while looking up along the wood grain."}, {"id": "cheese_rl_0524", "x": -2.9785256, "y": 5.6015124, "category": "reclining", "split": "train", "text": "趴圆凳上托腮、双脚后翘露脚底\nCurled on a round floor pouf, the blue tiger lies face-down with its chin propped on folded arms, its feet tucked so one sole faces up behind it, toes curled against the fabric."}, {"id": "cheese_rl_0525", "x": 12.180529, "y": -16.619772, "category": "one_hand", "split": "train", "text": "俯身伸手到雨桶上方，掌心朝上接水珠\nReaching down into a rain barrel, the blue tiger stops with one hand just above the water, palm open and fingers spread as droplets leap up toward the pads; the forearm and cupped hand are silhouetted against dark ripples."}, {"id": "cheese_rl_0526", "x": -20.543291, "y": 11.160933, "category": "identity_control", "split":
