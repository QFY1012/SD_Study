g weight onto it, flour dusting the wood."}, {"id": "cheese_rl_0005", "x": -19.014086, "y": 1.6716522, "category": "hand_detail", "split": "train", "text": "蓝色毛茸茸角色坐在竖琴旁，双爪拨弦，中近景展示上半身和面部。\nThe character sits relaxed beside a wooden harp, his upper body and face visible as both open blue furry paws pluck a single string, one paw pulling back while the other dampens a lower string with pads pressing the wood."}, {"id": "cheese_rl_0006", "x": 14.877518, "y": 4.9074907, "category": "one_sole", "split": "train", "text": "公园中单腿侧抬，脚掌正对镜头。\nThe character stands in a park and lifts one leg high to the side, bending the knee so the sole of that foot faces the camera, while balancing on the other leg with arms out for stability."}, {"id": "cheese_rl_0007", "x": -10.080055, "y": 9.612278, "category": "hand_and_foot", "split": "train", "text": "坐床边叠衣服，手掌平抚布料，脚掌朝上露肉垫\nFolding laundry while seated on a bed, the character smooths a shirt with one open palm flat on the fabric, and one bare foot rests sole-up on the mattress edge facing the viewer."}, {"id": "cheese_rl_0008", "x": -1.5878496, "y": -21.64495, "category": "moving", "split": "train", "text": "半跪种苗，双手轻托幼苗，手指清晰。\nThe character kneels to plant seedlings, both hands cupped around a small plant in the soil, fingers gentle around the stem. One knee on the ground, the other foot flat in a half-kneel."}, {"id": "cheese_rl_0009", "x": 17.300251, "y": -9.365404, "category": "identity_control", "split": "train", "text": "角色用力刷洗大锅上的污渍。\nThe character scrubs a stubborn stain from a large pot, both hands gripping a brush, shoulders hunched, water splashing onto the floor around the base of the pot."}, {"id": "cheese_rl_0010", "x": -18.719446, "y": 4.66244, "category": "sitting", "split": "train", "text": "坐在舞台边缘调小提琴，一手拧弦轴一手托琴。\nSeated on a stage-edge, the character dangles legs into the orchestra pit, tuning a violin with one hand twisting a peg and the other palm open under the instrument."}, {"id": "cheese_rl_0011", "x": 17.384169, "y": 4.365582, "category": "foot_detail", "split": "train", "text": "浅水中侧抬脚掌展示\nStanding in shallow surf, the character tilts a foot sideways so the sole faces the lens above the waterline. Toes splay as foam washes past, and the yellow pads gleam wet against a hazy ocean horizon."}, {"id": "cheese_rl_0012", "x": -4.125064, "y": 3.6908758, "category": "both_soles", "split": "train", "text": "坐姿双脚掌朝前并张开双手展示手掌与足底\nThe character sits on a soft cushion with legs bent forward so both soles face the camera, while holding both hands open at his sides after resting a small wooden drum beside his hip."}, {"id": "cheese_rl_0013", "x": -6.6203713, "y": 24.912235, "category": "reclining", "split": "train", "text": "躺椅上手提壶浇花\nRecline on a rooftop lounger with a small watering can, tipping it to water a potted plant with one hand, the other steadying the pot with fingers visible."}, {"id": "cheese_rl_0014", "x": 16.948387, "y": -16.87323, "category": "interaction", "split": "train", "text": "坐凳上用勺子舀水，另一手摊开接水滴\nSitting on a low stool, the character ladles water from a bucket with one hand and cups the other open palm under the ladle to catch drips, leaning forward over the pail."}, {"id": "cheese_rl_0015", "x": -6.656063, "y": 31.807976, "category": "both_hands", "split": "train", "text": "荡秋千双手前伸掌心向上\nSitting on a swing (but hands free), legs dangling, arms raised forward with palms up, fingers spread. Body swinging slightly. Background: playground."}, {"id": "cheese_rl_0016", "x": 17.480835, "y": 0.14969108, "category": "one_hand", "split": "train", "text": "角色站在屋顶，一只爪子伸向无人机，中景三分之四视角。\nOn a rooftop at dusk, the character stands in a relaxed three-quarter pose, reaching one open blue furry paw up toward a hovering drone that lowers a small parcel onto it, city lights glittering below."}, {"id": "cheese_rl_0017", "x": -4.8107505, "y": -7.980345, "category": "hand_and_foot", "split": "train", "text": "制陶轮旁双手塑泥，一脚踩踏板脚底朝低镜头\nSitting at a pottery wheel, the character shapes clay with both hands cupped around the spinning mound, and one bare foot presses the pedal with the sole turned up toward a low camera."}, {"id": "cheese_rl_0018", "x": -7.173513, "y": 0.8169824, "category": "identity_control", "split": "train", "text": "角色在工作台修烤面包机，双手清晰。\nThe character crouches at a low workbench repairing a toaster, one paw inside the casing with a screwdriver and the other holding a small tray of screws."}, {"id": "cheese_rl_0019", "x": 25.114323, "y": -0.5133216, "category": "moving", "split": "train", "text": "单膝跪在篝火旁，右掌举向火焰试探热度。\nThe character kneels on one knee beside a campfire, right palm held up near the flames to test the heat, left hand resting flat on the thigh. Face lit from below."}, {"id": "cheese_rl_0020", "x": -23.371851, "y": 5.8402185, "category": "hand_detail", "split": "train", "text": "指尖转篮球，另一手摊开平衡，展示手指与掌垫。\nBalancing a spinning basketball on one extended index fingertip, the character tilts his head back and steadies his other hand out for balance. Fingers on the balancing hand are spread flat beneath the ball."}, {"id": "cheese_rl_0021", "x": 23.715618, "y": 10.624417, "category": "sitting", "split": "train", "text": "坐矮墙上擦小号，一手按阀一手擦。\nThe character sits on a low wall polishing a brass trumpet, one hand wrapped around its valves and the other wiping the bell with a cloth."}, {"id": "cheese_rl_0022", "x": 16.56571, "y": 20.737043, "category": "one_sole", "split": "train", "text": "下车时脚踩门槛，脚掌透过车门朝向镜头。\nThe character steps out of a car and lifts one foot onto the door sill, sole facing the camera through the open door."}, {"id": "cheese_rl_0023", "x": -3.352246, "y": 15.943887, "category": "both_soles", "split": "train", "text": "豆袋椅上看书并抬起双脚\nReclining on a beanbag chair, the character balances a book on raised knees while both bare feet press flat against the air toward the lens, soles visible with toes curled slightly."}, {"id": "cheese_rl_0024", "x": 1.18269, "y": 2.9862373, "category": "foot_detail", "split": "train", "text": "踮脚够高 : "one_hand", "split": "train", "text": "市集伸手接零钱，掌心朝上\nAt a market stall, the character holds out one open palm to receive change, fingers gently spread toward the vendor."}, {"id": "cheese_rl_0045", "x": -17.623737, "y": 15.134702, "category": "moving", "split": "train", "text": "蓝色角色推购物车在超市过道走，双手握把手，一脚迈步。\nThe character pushes a shopping cart through a grocery aisle, both hands wrapped around the handlebar with palms facing down, one foot stepping forward mid-stride in a natural walk."}, {"id": "cheese_rl_0046", "x": 4.6104684, "y": -1.1024964, "category": "hand_and_foot", "split": "train", "text": "靠墙站立，双掌贴墙，一只脚掌贴墙朝向镜头\nThe character stands next to a brick wall and lifts one foot to rest against it, sole facing the camera, while both hands are placed flat on the wall at shoulder height, fingers spread."}, {"id": "cheese_rl_0047", "x": 16.410353, "y": -19.82081, "category": "one_sole", "split": "train", "text": "浴缸边抬脚查看脚底\nSitting in a bathtub's edge, the character lifts one wet foot onto the rim and examines the sole, toes dripping, while clutching a towel with the other hand."}, {"id": "cheese_rl_0048", "x": 11.678065, "y": -9.29958, "category": "foot_detail", "split": "train", "text": "从石头上跳下，后脚向后踢起露出脚底四趾。\nClose-up of the character stepping off a low boulder, one foot planted and the trailing foot kicked back so its sole faces the lens; toes and yellow pads crisp, dust puffing from the landing."}, {"id": "cheese_rl_0049", "x": -5.7706494, "y": 22.496582, "category": "reclining", "split": "train", "text": "吊床里垂脚露出脚掌\nRecline in a hammock with feet hanging out one end, one foot sole facing forward toward the camera, hands clasped behind head."}, {"id": "cheese_rl_0050", "x": 17.724905, "y": 13.248394, "category": "interaction", "split": "train", "text": "跨坐横梁伸手抓晃动的绳穗\nThe character straddles a low beam and reaches one open hand out to catch a dangling rope tassel, fingers spread wide, eyes focused on the swinging end."}, {"id": "cheese_rl_0051", "x": -6.8402843,
